[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "i18n-audit"
version = "0.1.0"
description = "Find translation bugs users actually see: broken placeholders, invalid ICU messages, lost Trans tags, missing keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "theluckystrike" }]
keywords = ["i18n", "l10n", "translation", "icu", "i18next", "gettext", "lint", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/theluckystrike/i18n-audit"
Issues = "https://github.com/theluckystrike/i18n-audit/issues"

[project.scripts]
i18n-audit = "i18n_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
