name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -v
      - name: CLI smoke test
        run: |
          i18n-audit --version
          i18n-audit tests/fixtures/clean
          if i18n-audit tests/fixtures/i18next; then echo "expected findings"; exit 1; fi

  action:
    name: action.yml self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clean fixture passes
        uses: ./
        with:
          path: tests/fixtures/clean
          upload-sarif: "false"
      - name: Buggy fixture produces SARIF without failing (fail-on 0)
        id: buggy
        uses: ./
        with:
          path: tests/fixtures/i18next
          fail-on: "0"
          code-scan: "true"
          upload-sarif: "false"
          sarif-file: buggy.sarif
          format: json
      - name: Check SARIF
        run: |
          python3 - <<'PY'
          import json
          doc = json.load(open("buggy.sarif"))
          results = doc["runs"][0]["results"]
          assert results, "no results"
          uris = {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] for r in results}
          assert all(u.startswith("tests/fixtures/i18next/") for u in uris), uris
          print(len(results), "results")
          PY
          test "${{ steps.buggy.outputs.exit-code }}" = "0"
          test "${{ steps.buggy.outputs.report-file }}" = "i18n-audit-report.json"
          python3 -c "import json; assert json.load(open('i18n-audit-report.json'))['findings']"
      - name: Fail-on threshold fails the step
        id: failing
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/i18next
          upload-sarif: "false"
          sarif-file: failing.sarif
      - name: Check failure was reported
        run: |
          test "${{ steps.failing.outcome }}" = "failure"
          test "${{ steps.failing.outputs.exit-code }}" = "1"
